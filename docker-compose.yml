services:
  postgres:
    image: postgres:16-alpine
    container_name: branv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: branv
      POSTGRES_PASSWORD: branv
      POSTGRES_DB: branv_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branv -d branv_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: branv-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: branv-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: branv
      MINIO_ROOT_PASSWORD: branv-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: branv-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 branv branv-secret &&
      mc mb --ignore-existing local/branv-dev &&
      mc anonymous set download local/branv-dev &&
      exit 0
      "

  # ─── FastAPI backend (apps/api) - the only API ────────────────────
  # Reads root .env. SCHEDULER_OWNER must be `fastapi` for cron jobs to run.
  api:
    container_name: branv-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://branv:branv@postgres:5432/branv_dev?schema=public
      S3_ENDPOINT: http://minio:9000
      API_INTERNAL_PORT: "5000"
      SCHEDULER_OWNER: "fastapi"
      # Keep the container in UTC so TOTP (time-based OTP) aligns with the
      # authenticator app. Oracle Cloud VMs can drift; the host localtime is
      # mounted read-only so the container's clock tracks the host exactly.
      TZ: UTC
    ports:
      - "5000:5000"
    volumes:
      # Inherit host clock - critical for TOTP correctness on VM deployments.
      - /etc/localtime:/etc/localtime:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
