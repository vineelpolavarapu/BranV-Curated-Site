name: CI

on:
  push:
    branches: [BranV-main]
  pull_request:
    branches: [BranV-main]

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cancel superseded check runs on the same ref to save minutes.
    concurrency:
      group: ci-checks-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @branv/shared build

      # prisma generate writes TypeScript types to node_modules — required
      # before the API can typecheck. No DB connection is made here.
      - name: Generate Prisma client
        run: pnpm --filter @branv/api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm --filter @branv/shared --filter @branv/api lint

      # `tsc --noEmit` does not see .next/types/**/*.ts, so it cannot catch
      # App Router contract violations (invalid Page/Layout/Route exports,
      # bad PageProps shape, etc). Running `next build` here closes that gap
      # so the deploy job never fails on something CI could have caught.
      - name: Build web (validates Next.js App Router contracts)
        run: pnpm --filter @branv/web build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:5000' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME || 'BranV' }}

  deploy-web:
    name: Deploy Web (Vercel)
    needs: typecheck-and-lint
    # Only deploy on push to BranV-main — never from PRs (forks have no secret access)
    if: github.event_name == 'push' && github.ref == 'refs/heads/BranV-main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never cancel a deploy mid-upload; queue subsequent deploys instead.
    concurrency:
      group: deploy-web-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Emit a job-summary card so the commit SHA, branch, and production URL
      # are always visible at the top of the Actions run — no more guessing
      # whether "the pipeline ran" actually deployed the commit you just pushed.
      - name: Log deployment context
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          echo "## Vercel Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Production URL | $SITE_URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploying commit ${{ github.sha }} (branch: ${{ github.ref_name }})"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Every later step in this job (`vercel pull`, `vercel build`, `vercel
      # deploy`) relies on these three being set. A missing or
      # environment-scoped secret does NOT fail here with an auth error —
      # GitHub Actions silently substitutes an empty string, so the actual
      # failure only shows up several steps later as a cryptic Vercel CLI
      # error (e.g. "You defined "--token", but it's missing a value").
      # Fail fast here instead, with a message that names the secret.
      - name: Verify required Vercel deploy secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required repository secret(s): ${missing[*]}. Set them under Settings > Secrets and variables > Actions > Repository secrets (not Environment secrets, since this job has no 'environment:')."
            exit 1
          fi

      # vercel.json's installCommand handles `pnpm install` at build time,
      # so we don't run it again here.
      #
      # Run every vercel CLI step from the repo root, never `cd apps/web`
      # first: the Vercel project's Root Directory setting (apps/web) is
      # what tells the CLI where the project lives. Combining that setting
      # with a manual `working-directory: apps/web` here makes Vercel
      # resolve the project path twice (apps/web/apps/web), which is the
      # "File does not exist" / path-not-found class of failure seen before.
      - name: Pull Vercel project config
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Same silent-empty-string pitfall as the Vercel secrets check above:
      # a missing or environment-scoped secret does not error here, it just
      # becomes "". Name the missing secret explicitly instead of letting
      # `vercel build` fail later with an unrelated-looking error.
      - name: Verify required web env vars
        env:
          API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          missing=()
          [ -z "$API_BASE_URL" ] && missing+=("NEXT_PUBLIC_API_BASE_URL")
          [ -z "$SITE_URL" ] && missing+=("NEXT_PUBLIC_SITE_URL")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required repository secret(s): ${missing[*]}. Set them under Settings > Secrets and variables > Actions > Repository secrets (not Environment secrets, since this job has no 'environment:')."
            exit 1
          fi

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
          WEB_ORIGIN: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy pre-built output
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOY_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Smoke-test the Vercel deployment URL to confirm the build is actually
      # live before the job reports success. This catches cases where the CLI
      # exits 0 but the edge network is still propagating (or the deploy
      # silently targeted the wrong project). Retries with back-off so a cold
      # Vercel edge doesn't produce a false alarm. A warning (not a hard
      # failure) is emitted if the URL is still non-200 after all retries —
      # this avoids blocking the pipeline on transient CDN latency.
      - name: Verify deployment is live
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          echo "Vercel deployment URL : $DEPLOY_URL"
          echo "Production domain     : $SITE_URL"
          echo "Commit deployed       : ${{ github.sha }}"
          echo "## Vercel Deployment Result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vercel URL: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          STATUS="000"
          for i in $(seq 1 8); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$DEPLOY_URL" \
              --max-time 15 --retry 0 2>/dev/null || echo "000")
            echo "Smoke-test attempt $i/8: HTTP $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 8
          done
          if [ "$STATUS" = "200" ]; then
            echo "Deployment smoke-test PASSED — $DEPLOY_URL is live." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Smoke-test returned HTTP $STATUS after 8 attempts. The deploy URL ($DEPLOY_URL) may still be propagating, or the wrong project was targeted. Verify $SITE_URL manually."
            echo "**Warning**: smoke-test returned HTTP $STATUS — verify $SITE_URL manually." >> "$GITHUB_STEP_SUMMARY"
          fi
