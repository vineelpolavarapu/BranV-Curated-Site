name: Deploy API (GHCR)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [BranV-main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build (branch, tag, or SHA). Defaults to BranV-main.
        required: false
        default: BranV-main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vineelpolavarapu/branv-api

jobs:

  check-ci-status:
    name: Check backend-relevant CI status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    permissions:
      actions: read
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      # The CI workflow bundles an unrelated frontend job (Deploy Web (Vercel))
      # together with the backend checks (Typecheck & Lint) under one workflow.
      # If the frontend deploy fails, the whole "CI" run's conclusion becomes
      # "failure", which previously caused this backend image build to be
      # skipped even when the backend code itself was fine. Instead, look up
      # the actual conclusion of the "Typecheck & Lint" job (which runs prisma
      # generate / typecheck / lint for the API) and gate the backend deploy on
      # that job alone, so an unrelated frontend deploy failure can no longer
      # block backend deployments.
      - name: Evaluate Typecheck & Lint job result
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const job = data.jobs.find((j) => j.name === 'Typecheck & Lint');
            const success = !!job && job.conclusion === 'success';
            core.info(`Typecheck & Lint conclusion: ${job ? job.conclusion : 'not found'}`);
            core.setOutput('should_deploy', success ? 'true' : 'false');

  build-and-push:
    name: Build and push API image
    runs-on: ubuntu-latest
    needs: [check-ci-status]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && needs.check-ci-status.outputs.should_deploy == 'true'))
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-api-ghcr-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Set checkout ref
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "checkout_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "image_revision=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            ref="${{ inputs.git_ref }}"
            if [ -z "$ref" ]; then
              ref="BranV-main"
            fi
            echo "checkout_ref=$ref" >> "$GITHUB_OUTPUT"
            echo "image_revision=$ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.image_revision }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check-deploy-secrets:
    name: Check VM deploy secrets
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    outputs:
      has_ssh_host: ${{ steps.check.outputs.has_ssh_host }}
    steps:
      # secrets can't be referenced directly in a job-level `if:`, so check
      # it here (secrets ARE allowed in step env) and expose it as an output.
      - name: Check OCI_SSH_HOST secret
        id: check
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
        shell: bash
        run: |
          if [ -n "$OCI_SSH_HOST" ]; then
            echo "has_ssh_host=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ssh_host=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-to-vm:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest
    needs: [build-and-push, check-deploy-secrets]
    if: >-
      always() &&
      needs.build-and-push.result == 'success' &&
      needs.check-deploy-secrets.outputs.has_ssh_host == 'true'
    concurrency:
      group: deploy-vm-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Deploy image + sync NTP on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e

            # ── 1. Fix clock drift (root cause of TOTP "Invalid 2FA code") ──
            if command -v chronyc &>/dev/null; then
              sudo chronyc makestep
            elif command -v ntpdate &>/dev/null; then
              sudo ntpdate -u pool.ntp.org
            fi
            if command -v timedatectl &>/dev/null; then
              sudo timedatectl set-ntp true
            fi

            # ── 2. Pull latest image and restart the API container ───────────
            # OCI_DEPLOY_PATH defaults to ~/branv — set it as a repository
            # variable (Settings → Variables → Actions) if your path differs.
            DEPLOY_PATH="${OCI_DEPLOY_PATH:-$HOME/branv}"
            cd "$DEPLOY_PATH"
            docker compose pull api
            docker compose up -d --no-deps api

            # ── 3. Confirm the container came up ─────────────────────────────
            sleep 5
            docker compose ps api
