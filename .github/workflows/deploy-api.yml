name: Deploy API (GHCR)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [BranV-main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build (branch, tag, or SHA). Defaults to BranV-main.
        required: false
        default: BranV-main
      seed_categories:
        description: Also run deploy/seed-categories.sql against production Postgres (one-off, idempotent).
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vineelpolavarapu/branv-api

jobs:

  check-ci-status:
    name: Check backend-relevant CI status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    permissions:
      actions: read
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      # The CI workflow bundles an unrelated frontend job (Deploy Web (Vercel))
      # together with the backend checks (Typecheck & Lint) under one workflow.
      # If the frontend deploy fails, the whole "CI" run's conclusion becomes
      # "failure", which previously caused this backend image build to be
      # skipped even when the backend code itself was fine. Instead, look up
      # the actual conclusion of the "Typecheck & Lint" job (which runs prisma
      # generate / typecheck / lint for the API) and gate the backend deploy on
      # that job alone, so an unrelated frontend deploy failure can no longer
      # block backend deployments.
      - name: Evaluate Typecheck & Lint job result
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const job = data.jobs.find((j) => j.name === 'Typecheck & Lint');
            const success = !!job && job.conclusion === 'success';
            core.info(`Typecheck & Lint conclusion: ${job ? job.conclusion : 'not found'}`);
            core.setOutput('should_deploy', success ? 'true' : 'false');

  build-and-push:
    name: Build and push API image
    runs-on: ubuntu-latest
    needs: [check-ci-status]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && needs.check-ci-status.outputs.should_deploy == 'true'))
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-api-ghcr-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Set checkout ref
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "checkout_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "image_revision=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            ref="${{ inputs.git_ref }}"
            if [ -z "$ref" ]; then
              ref="BranV-main"
            fi
            echo "checkout_ref=$ref" >> "$GITHUB_OUTPUT"
            echo "image_revision=$ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify API Python syntax
        shell: bash
        run: python -m compileall -q apps/api/app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.image_revision }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check-deploy-secrets:
    name: Check VM deploy secrets and variables
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    steps:
      # A missing or environment-scoped secret does NOT fail here with an
      # auth error - GitHub Actions silently substitutes an empty string, so
      # the deploy-to-vm job below used to just silently show as "skipped"
      # with no indication why (the image built and pushed fine, but nobody
      # noticed the VM never actually got updated). Fail loudly here instead,
      # naming exactly which secret/variable is missing, so a bad/missing
      # value is a visible red X, not a quiet no-op or a silent deploy to the
      # wrong path (OCI_DEPLOY_PATH previously had a fallback default that
      # didn't match the VM's real deploy folder - now it's required).
      - name: Verify required VM deploy secrets and variables
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_DEPLOY_PATH: ${{ vars.OCI_DEPLOY_PATH }}
        shell: bash
        run: |
          missing=()
          [ -z "$OCI_SSH_HOST" ] && missing+=("OCI_SSH_HOST (repository secret)")
          [ -z "$OCI_SSH_USER" ] && missing+=("OCI_SSH_USER (repository secret)")
          [ -z "$OCI_SSH_KEY" ] && missing+=("OCI_SSH_KEY (repository secret)")
          [ -z "$OCI_DEPLOY_PATH" ] && missing+=("OCI_DEPLOY_PATH (repository VARIABLE, e.g. /opt/branv)")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required repository secret(s)/variable(s): ${missing[*]}. Secrets go under Settings > Secrets and variables > Actions > Secrets tab (not Environment secrets, since these jobs have no 'environment:'). OCI_DEPLOY_PATH goes under the Variables tab of the same page - it's the absolute path to the deploy folder on the VM, plain text, not sensitive. The API image built and pushed to GHCR fine - only the VM deploy steps are blocked on these."
            exit 1
          fi

  sync-deploy-config:
    name: Sync deploy config to VM
    runs-on: ubuntu-latest
    needs: [build-and-push, check-deploy-secrets]
    # check-ci-status only runs for workflow_run events (it skips itself for
    # workflow_dispatch) - that "skipped" status cascades to every downstream
    # job by default unless each one explicitly opts out with always(), same
    # as build-and-push and check-deploy-secrets already do above. Without
    # this, manual workflow_dispatch runs silently skip this job entirely.
    if: always() && needs.build-and-push.result == 'success' && needs.check-deploy-secrets.result == 'success'
    steps:
      - name: Set checkout ref
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "checkout_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            ref="${{ inputs.git_ref }}"
            echo "checkout_ref=${ref:-BranV-main}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.checkout_ref }}

      # Ships docker-compose.yml, Caddyfile, and the Prisma schema/migrations
      # from git straight to the VM on every deploy, so the running stack can
      # never silently drift from what's committed (previously these were
      # scp'd by hand once and never touched again). The VM's own .env (real
      # secrets) lives outside this repo and is never written by this step.
      - name: Copy docker-compose.yml + Caddyfile to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: ${{ vars.OCI_DEPLOY_PATH }}
          strip_components: 1

      - name: Copy Prisma schema + migrations to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "prisma"
          target: ${{ vars.OCI_DEPLOY_PATH }}

  deploy-to-vm:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest
    needs: [build-and-push, check-deploy-secrets, sync-deploy-config]
    # Same skip-cascade guard as sync-deploy-config above - without this,
    # workflow_dispatch runs skip this job too (this was latent even before
    # sync-deploy-config existed, just never noticed since manual dispatch
    # was rarely used to test the VM deploy path).
    if: always() && needs.build-and-push.result == 'success' && needs.check-deploy-secrets.result == 'success' && needs.sync-deploy-config.result == 'success'
    concurrency:
      group: deploy-vm-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Deploy image + migrate + health-check on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            DEPLOY_PATH="${{ vars.OCI_DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"

            # ── 1. Fix clock drift (root cause of TOTP "Invalid 2FA code") ──
            if command -v chronyc &>/dev/null; then
              sudo chronyc makestep
            elif command -v ntpdate &>/dev/null; then
              sudo ntpdate -u pool.ntp.org
            fi
            if command -v timedatectl &>/dev/null; then
              sudo timedatectl set-ntp true
            fi

            # ── 2. Record the currently-running api image so we can roll back ──
            PREV_IMAGE=""
            RUNNING_ID=$(docker compose ps -q api || true)
            if [ -n "$RUNNING_ID" ]; then
              PREV_IMAGE=$(docker inspect --format='{{.Image}}' "$RUNNING_ID" || true)
            fi

            # ── 3. Pull latest images and apply pending Prisma migrations ──────
            # Previously this ran `docker compose up -d --no-deps api`, which
            # skips the migrate service entirely - new migrations committed to
            # git were never applied automatically. Run migrate explicitly and
            # wait for it to actually finish (`up -d` alone only starts it, it
            # doesn't block until the one-shot container exits).
            docker compose pull api migrate
            docker compose up -d migrate
            for i in $(seq 1 30); do
              MIGRATE_ID=$(docker compose ps -a -q migrate)
              STATUS=$(docker inspect --format='{{.State.Status}}' "$MIGRATE_ID")
              [ "$STATUS" = "exited" ] && break
              sleep 2
            done
            MIGRATE_EXIT=$(docker inspect --format='{{.State.ExitCode}}' "$MIGRATE_ID")
            if [ "$MIGRATE_EXIT" != "0" ]; then
              echo "::error::Prisma migration failed (exit $MIGRATE_EXIT) - aborting before touching the api container."
              docker compose logs migrate --tail 100
              exit 1
            fi

            # ── 4. Restart the API container ────────────────────────────────
            docker compose up -d --no-deps --force-recreate api

            # ── 5. Health-check gate - a Restarting container used to still
            # report success here (`docker compose ps` never fails the job).
            # The api service only `expose`s port 5000 to the internal Docker
            # network (no `ports:` mapping to the host), so a plain
            # `curl localhost:5000` from the VM's own shell always gets
            # connection refused - it has to be checked through Docker itself.
            # Poll the container's own HEALTHCHECK status (see
            # deploy/docker-compose.yml) instead. Retry with backoff, then
            # fail loudly and roll back on failure.
            HEALTHY=false
            for i in $(seq 1 20); do
              API_ID=$(docker compose ps -q api)
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$API_ID" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "API is healthy."
              docker compose ps
            else
              echo "::error::API failed health check after deploy. Recent logs:"
              docker compose logs api --tail 100
              if [ -n "$PREV_IMAGE" ]; then
                echo "::warning::Rolling back api to previous image $PREV_IMAGE"
                docker tag "$PREV_IMAGE" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                docker compose up -d --no-deps --force-recreate api
                sleep 5
                docker compose ps api
              else
                echo "::error::No previous image was recorded - cannot auto-rollback. Manual intervention required on the VM."
              fi
              exit 1
            fi

  seed-categories-data:
    name: Seed production categories (one-off)
    runs-on: ubuntu-latest
    needs: [check-deploy-secrets, deploy-to-vm]
    # Same always() requirement as sync-deploy-config/deploy-to-vm above -
    # without it, GitHub implicitly ANDs in success() across the whole
    # ancestor graph (including check-ci-status, which skips itself on
    # workflow_dispatch), so this job silently skips despite every explicit
    # condition below being true. Confirmed via a debug run: both
    # github.event.inputs.seed_categories and inputs.seed_categories
    # correctly resolved to 'true' and deploy-to-vm had already succeeded,
    # yet the job was still skipped until always() was added here.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.seed_categories == 'true' &&
      needs.deploy-to-vm.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy seed script to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "deploy/seed-categories.sql"
          target: ${{ vars.OCI_DEPLOY_PATH }}
          strip_components: 1

      - name: Run seed script against production Postgres
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.OCI_DEPLOY_PATH }}"
            docker compose exec -T postgres psql -U branv -d branv < seed-categories.sql
            echo "=== Category count after seed ==="
            docker compose exec -T postgres psql -U branv -d branv -c "SELECT count(*) FROM categories;"
