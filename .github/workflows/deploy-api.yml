name: Deploy API (Railway)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    # Only deploy when CI passes — never deploy a broken build
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # Railway pulls the latest commit from GitHub after the hook fires,
      # so we just need to trigger it — no build happens here.
      - name: Trigger Railway deployment
        run: curl -sS -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}"
