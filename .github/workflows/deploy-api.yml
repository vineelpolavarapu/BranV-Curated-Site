name: Deploy API (Railway)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [BranV-main]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    # Only deploy when CI passes — never deploy a broken build
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # Railway pulls the latest commit from GitHub after the deploy hook fires,
      # builds the Docker image from apps/api/Dockerfile, and runs migrations.
      # No checkout or Docker build needed here — Railway handles it all.
      - name: Trigger Railway deployment
        run: curl -sS -f -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}"
