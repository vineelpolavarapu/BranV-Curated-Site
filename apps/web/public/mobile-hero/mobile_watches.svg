<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Watches">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4d77a"/>
      <stop offset="0.7" stop-color="#c69b3a"/>
      <stop offset="1" stop-color="#7a5a1c"/>
    </radialGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#1a1208"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1600" fill="url(#bg)"/>
  <!-- subtle gold particles -->
  <g fill="#d4af37" opacity="0.4">
    <circle cx="120" cy="180" r="2"/>
    <circle cx="780" cy="120" r="2"/>
    <circle cx="80" cy="600" r="2"/>
    <circle cx="820" cy="540" r="2"/>
    <circle cx="160" cy="1400" r="2"/>
    <circle cx="760" cy="1480" r="2"/>
    <circle cx="240" cy="280" r="1.5"/>
    <circle cx="680" cy="1300" r="1.5"/>
  </g>
  <!-- watch -->
  <g transform="translate(450 720)">
    <!-- strap top -->
    <rect x="-90" y="-440" width="180" height="220" fill="url(#strap)" rx="10"/>
    <!-- strap holes -->
    <g fill="#0a0a0a">
      <circle cx="0" cy="-380" r="6"/>
      <circle cx="0" cy="-340" r="6"/>
      <circle cx="0" cy="-300" r="6"/>
    </g>
    <!-- strap bottom -->
    <rect x="-90" y="220" width="180" height="220" fill="url(#strap)" rx="10"/>
    <!-- watch case -->
    <circle cx="0" cy="0" r="220" fill="url(#gold)" stroke="#3a2818" stroke-width="4"/>
    <circle cx="0" cy="0" r="190" fill="#0a0a0a"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#d4af37" stroke-width="2"/>
    <!-- hour markers -->
    <g stroke="#d4af37" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-170" x2="0" y2="-145"/>
      <line x1="0" y1="170" x2="0" y2="145"/>
      <line x1="-170" y1="0" x2="-145" y2="0"/>
      <line x1="170" y1="0" x2="145" y2="0"/>
    </g>
    <g stroke="#d4af37" stroke-width="2" opacity="0.7">
      <line x1="120" y1="-120" x2="135" y2="-135"/>
      <line x1="-120" y1="-120" x2="-135" y2="-135"/>
      <line x1="120" y1="120" x2="135" y2="135"/>
      <line x1="-120" y1="120" x2="-135" y2="135"/>
    </g>
    <!-- hands -->
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="80" y2="40" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#d4af37"/>
    <!-- crown -->
    <rect x="215" y="-12" width="18" height="24" fill="url(#gold)" stroke="#3a2818" stroke-width="2"/>
  </g>
</svg>
