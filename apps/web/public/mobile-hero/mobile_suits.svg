<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The Suit Edit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <pattern id="stripe" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="1600" fill="url(#bg)"/>
  <rect width="900" height="1600" fill="url(#stripe)"/>
  <!-- suit lapels -->
  <g transform="translate(450 480)" fill="#161616" stroke="#d4af37" stroke-width="2" opacity="0.95">
    <polygon points="-260,-200 -40,100 -40,560 -260,560"/>
    <polygon points="260,-200 40,100 40,560 260,560"/>
    <polygon points="-40,100 0,120 40,100 40,560 -40,560" fill="#0a0a0a"/>
    <!-- pocket square -->
    <polygon points="-200,0 -120,0 -130,80 -195,75" fill="#d4af37" stroke="none" opacity="0.85"/>
    <!-- buttons -->
    <circle cx="0" cy="240" r="10" fill="#d4af37" stroke="none"/>
    <circle cx="0" cy="360" r="10" fill="#d4af37" stroke="none"/>
  </g>
</svg>
