<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sharp Formals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a2e"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1600" fill="url(#bg)"/>
  <rect width="900" height="1600" fill="url(#shine)"/>
  <!-- shirt collar V -->
  <g transform="translate(450 520)" fill="none" stroke="#e6ecf5" stroke-width="6" stroke-linejoin="round" opacity="0.85">
    <path d="M-180 -260 L0 80 L180 -260"/>
    <path d="M-180 -260 L-220 -180 L-40 40"/>
    <path d="M180 -260 L220 -180 L40 40"/>
    <circle cx="0" cy="160" r="14" fill="#e6ecf5" stroke="none"/>
    <circle cx="0" cy="280" r="14" fill="#e6ecf5" stroke="none"/>
    <circle cx="0" cy="400" r="14" fill="#e6ecf5" stroke="none"/>
  </g>
  <!-- subtle pinstripes -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1600"/>
    <line x1="180" y1="0" x2="180" y2="1600"/>
    <line x1="720" y1="0" x2="720" y2="1600"/>
    <line x1="820" y1="0" x2="820" y2="1600"/>
  </g>
</svg>
