<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Trendy Wear">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5e8a"/>
      <stop offset="0.5" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1600" fill="url(#bg)"/>
  <!-- abstract geometric shapes -->
  <g opacity="0.6">
    <circle cx="200" cy="320" r="180" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="700" cy="220" r="120" fill="#ff2d6a" fill-opacity="0.55"/>
    <polygon points="180,820 460,640 460,1000" fill="#7a1f3d" fill-opacity="0.35"/>
    <rect x="560" y="900" width="240" height="240" rx="40" fill="#ffffff" fill-opacity="0.22" transform="rotate(18 680 1020)"/>
    <circle cx="280" cy="1280" r="80" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="640" cy="1380" r="50" fill="#7a1f3d" fill-opacity="0.5"/>
  </g>
  <!-- dotted texture -->
  <g fill="#ffffff" fill-opacity="0.18">
    <circle cx="120" cy="120" r="4"/>
    <circle cx="780" cy="80" r="4"/>
    <circle cx="60" cy="600" r="4"/>
    <circle cx="820" cy="540" r="4"/>
    <circle cx="120" cy="1480" r="4"/>
    <circle cx="780" cy="1520" r="4"/>
  </g>
</svg>
