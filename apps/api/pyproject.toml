[project]
name = "branv-api-py"
version = "0.1.0"
description = "BranV API - Python / FastAPI port of apps/api (NestJS). See ../../NESTJS_TO_FASTAPI_MIGRATION_PLAN.md."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Framework
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.32,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    # Database - Prisma owns the schema; SQLAlchemy reads it.
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "greenlet>=3.1",
    # Auth
    "pyjwt>=2.10,<3",
    "argon2-cffi>=23.1,<26",
    "pyotp>=2.9,<3",
    "qrcode[pil]>=8.0,<9",
    # HTTP out
    "httpx>=0.28,<0.29",
    # S3 - aioboto3 for async I/O, boto3 only for presign (CPU-bound).
    "aioboto3>=13.2,<14",
    "boto3>=1.35,<2",
    # Scraping - port cheerio selectors verbatim.
    "selectolax>=0.3.27,<0.4",
    "beautifulsoup4>=4.12,<5",
    # Scheduling - APScheduler async + PG advisory locks per playbook §8.
    "apscheduler>=3.10,<4",
    # Logging
    "structlog>=24.4,<25",
    # CORS / multipart
    "python-multipart>=0.0.18,<0.1",
    "bcrypt>=5.0.0",
    "passlib>=1.7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "deepdiff>=8.0,<9",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
    "httpx>=0.28.1",
    "email-validator>=2.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]  # let formatter handle line length

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
