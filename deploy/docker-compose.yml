# Production compose stack for the Oracle Cloud Always Free AMD VM (1 GB RAM).
# API = FastAPI (Python 3.12). NestJS code is no longer deployed.
#
# Layout on the VM:
#   /opt/branv/deploy/                 <- this folder only (no source code)
#   /opt/branv/deploy/docker-compose.yml
#   /opt/branv/deploy/Caddyfile
#   /opt/branv/deploy/.env             <- copy from .env.production.example, fill
#   /opt/branv/deploy/prisma/          <- Prisma schema + migrations (read-only)
#                                         used by the one-shot `migrate` service
#
# The FastAPI image is PULLED from GHCR - we never build on the VM because the
# 1 GB RAM ceiling is too tight even for the Python build.
#
# First deploy (from your laptop, in the repo root):
#   # 1. Build the FastAPI image - context MUST be apps/api/ (where pyproject.toml lives)
#   docker build -t ghcr.io/vineelpolavarapu/branv-api:latest apps/api
#   docker push ghcr.io/vineelpolavarapu/branv-api:latest
#
#   # 2. Copy Prisma schema + migrations into deploy/ so the migrate service can mount it
#   #    (prisma/ lives at the repo ROOT after the FastAPI migration, not under apps/api/)
#   Copy-Item -Recurse -Force prisma deploy\prisma
#
#   # 3. Send deploy/ to the VM
#   scp -i C:\Users\Lenovo\.ssh\branv-prod.key -r deploy ubuntu@<VM_IP>:/tmp/branv-deploy
#   ssh -i C:\Users\Lenovo\.ssh\branv-prod.key ubuntu@<VM_IP>
#     sudo mv /tmp/branv-deploy /opt/branv && cd /opt/branv/deploy
#     cp .env.production.example .env  # edit secrets
#     docker login ghcr.io -u vineelpolavarapu  # paste GHCR PAT
#     docker compose pull
#     docker compose up -d
#     docker compose logs -f api
#
# Updates:
#   (laptop) docker build -t ghcr.io/vineelpolavarapu/branv-api:latest apps/api
#            docker push  ghcr.io/vineelpolavarapu/branv-api:latest
#   (VM)     cd /opt/branv/deploy && docker compose pull && docker compose up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on:
      - api

  # One-shot Prisma migrator. Runs `prisma migrate deploy` against the live
  # Postgres, then exits. Mounts the prisma/ folder shipped in deploy/.
  # The FastAPI app does not own the schema - Prisma still owns it (the Python
  # SQLAlchemy models are read-only auto-generated views of the Prisma schema).
  migrate:
    # node:20-alpine (musl libc) lacks the OpenSSL variant Prisma's schema
    # engine binary needs - it crashes on startup and its error text gets fed
    # into the JSON parser instead of a real response ("Could not parse
    # schema engine response... 'Error load'... is not valid JSON"). Use
    # bullseye-slim (glibc) and install openssl/ca-certificates explicitly.
    image: node:20-bullseye-slim
    restart: "no"
    volumes:
      - ./prisma:/prisma:ro
    environment:
      DATABASE_URL: postgresql://branv:${DB_PASSWORD}@postgres:5432/branv?schema=public
    working_dir: /prisma
    entrypoint:
      - sh
      - -c
      - |
        apt-get update && apt-get install -y --no-install-recommends openssl ca-certificates && \
        npx --yes prisma@5 migrate deploy --schema=/prisma/schema.prisma
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/vineelpolavarapu/branv-api:latest
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      # Inherit host clock so TOTP codes stay accurate even if the VM drifts.
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Keep container in UTC so TOTP aligns with the authenticator app.
      TZ: UTC
      # ── Core ──────────────────────────────────────────────────────────────
      DATABASE_URL: postgresql://branv:${DB_PASSWORD}@postgres:5432/branv?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN}
      BASE_CURRENCY: "INR"
      # FastAPI-specific
      SCHEDULER_OWNER: "fastapi"
      PY_LOG_LEVEL: "info"
      USE_MOCK_INTEGRATIONS: "false"
      # ── Auth ──────────────────────────────────────────────────────────────
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_REFRESH_TTL_SECONDS: "604800"
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SAMESITE: "lax"
      TOTP_ISSUER: "BranV"
      AUTH_LOCKOUT_MAX_ATTEMPTS: "5"
      AUTH_LOCKOUT_WINDOW_MIN: "15"
      AUTH_LOCKOUT_DURATION_MIN: "15"
      AUTH_RATE_LIMIT_PER_MIN: "5"
      # ── Object storage (Cloudflare R2) ────────────────────────────────────
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      # Public base URL browsers use to GET objects. R2's S3 endpoint above is the
      # private S3 API; this must point at the bucket's r2.dev subdomain or a bound
      # custom domain (public access enabled on the bucket). Without it, stored
      # image URLs point at the private endpoint and 404 in the browser.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      # ── Affiliate integrations ────────────────────────────────────────────
      AMAZON_ASSOCIATES_TAG: ${AMAZON_ASSOCIATES_TAG}
      AMAZON_ACCESS_KEY: ${AMAZON_ACCESS_KEY}
      AMAZON_SECRET_KEY: ${AMAZON_SECRET_KEY}
      AMAZON_REGION: "IN"
      EARNKARO_API_KEY: ${EARNKARO_API_KEY}
      # ── Email (Resend) ────────────────────────────────────────────────────
      MAIL_PROVIDER: "resend"
      MAIL_API_KEY: ${MAIL_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      # ── Scraper ───────────────────────────────────────────────────────────
      SCRAPER_USER_AGENT: "Mozilla/5.0 (compatible; BranVBot/1.0)"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: branv
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: branv
    # Memory tuned for a 1 GB RAM host. Defaults (shared_buffers=128MB is fine
    # but Postgres also wants ~25% of RAM for effective_cache_size, and the
    # default work_mem can balloon with parallel sorts). Hard caps below keep
    # the steady-state resident set under ~250 MB.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=20
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branv -d branv"]
      interval: 10s
      timeout: 5s
      retries: 5

# NOTE: nightly pg_dump to R2 lives outside compose. See deploy/backup.sh and
# the cron entry in deploy/install-backup-cron.sh. Running it in-container would
# cost ~150 MB resident memory that this 1 GB VM cannot spare.

volumes:
  pg_data:
  caddy_data:
  caddy_config:
