# Production compose stack for the Oracle Cloud Always Free AMD VM (1 GB RAM).
#
# Layout on the VM:
#   /opt/branv/deploy/                 <- this folder only (no source code)
#   /opt/branv/deploy/docker-compose.yml
#   /opt/branv/deploy/Caddyfile
#   /opt/branv/deploy/.env             <- copy from .env.production.example, fill in
#
# Pre-built API image is PULLED from GHCR — we never build on the VM because
# `nest build` peaks ~1.2 GB and the VM has only 1 GB RAM.
#
# First deploy (from your laptop, in the repo root):
#   docker build -t ghcr.io/vineelpolavarapu/branv-api:latest -f apps/api/Dockerfile .
#   docker push ghcr.io/vineelpolavarapu/branv-api:latest
#   scp -i ~/.ssh/branv-prod.key -r deploy ubuntu@<VM_IP>:/tmp/
#   ssh ubuntu@<VM_IP>
#     sudo mv /tmp/deploy /opt/branv && cd /opt/branv/deploy
#     cp .env.production.example .env  # edit secrets
#     docker login ghcr.io -u vineelpolavarapu  # use GHCR PAT
#     docker compose pull
#     docker compose up -d
#
# Updates:
#   (laptop) docker build ... && docker push ...
#   (VM)     cd /opt/branv/deploy && docker compose pull && docker compose up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on:
      - api

  api:
    image: ghcr.io/vineelpolavarapu/branv-api:latest
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://branv:${DB_PASSWORD}@postgres:5432/branv?schema=public
      # Auth
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_REFRESH_TTL_SECONDS: "604800"
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SAMESITE: "lax"
      TOTP_ISSUER: "BranV"
      WEB_ORIGIN: ${WEB_ORIGIN}
      AUTH_LOCKOUT_MAX_ATTEMPTS: "5"
      AUTH_LOCKOUT_WINDOW_MIN: "15"
      AUTH_LOCKOUT_DURATION_MIN: "15"
      AUTH_RATE_LIMIT_PER_MIN: "5"
      # Object storage (Cloudflare R2 recommended in prod)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      # Integrations
      USE_MOCK_INTEGRATIONS: "false"
      CUELINKS_API_KEY: ${CUELINKS_API_KEY}
      CUELINKS_API_BASE: "https://www.cuelinks.com/api/v2"
      AMAZON_ASSOCIATES_TAG: ${AMAZON_ASSOCIATES_TAG}
      AMAZON_ACCESS_KEY: ${AMAZON_ACCESS_KEY}
      AMAZON_SECRET_KEY: ${AMAZON_SECRET_KEY}
      AMAZON_REGION: "IN"
      EARNKARO_API_KEY: ${EARNKARO_API_KEY}
      MAIL_PROVIDER: "resend"
      MAIL_API_KEY: ${MAIL_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      SCRAPER_USER_AGENT: "Mozilla/5.0 (compatible; BranVBot/1.0)"
      BASE_CURRENCY: "INR"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: branv
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: branv
    # Memory tuned for a 1 GB RAM host. Defaults (shared_buffers=128MB is fine
    # but Postgres also wants ~25% of RAM for effective_cache_size, and the
    # default work_mem can balloon with parallel sorts). Hard caps below keep
    # the steady-state resident set under ~250 MB.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=20
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branv -d branv"]
      interval: 10s
      timeout: 5s
      retries: 5

# NOTE: nightly pg_dump to R2 lives outside compose. See deploy/backup.sh and
# the cron entry in deploy/install-backup-cron.sh. Running it in-container would
# cost ~150 MB resident memory that this 1 GB VM cannot spare.

volumes:
  pg_data:
  caddy_data:
  caddy_config:
